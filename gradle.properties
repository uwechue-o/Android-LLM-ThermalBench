# ---- JVM ----
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# ---- Android ----
android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 8.7.x was validated by Google up to compileSdk 35; ThermalBench builds
# against 36 (GUIDE.md target). Raise AGP once Android Studio is updated.
android.suppressUnsupportedCompileSdk=36
# The lint checks bundled inside androidx (lifecycle, compose) are compiled
# against a newer Kotlin Analysis API than the lint that ships with AGP 8.7.3,
# which makes them crash with "Found class Ka..., but interface was expected".
# Running a newer standalone lint fixes it without moving AGP.
android.experimental.lint.version=8.13.2

# ---- Kotlin ----
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2g

# ---- ThermalBench build switches ----
# The llama.cpp JNI adapter needs the NDK + CMake and a llama.cpp checkout.
# Off by default so the project builds on machines without an NDK; the adapter
# then reports the backend as unavailable (a recorded gap, never a crash).
# Enable it per machine in ~/.gradle/gradle.properties, which overrides this file,
# so a checkout path never lands in the repository. Forward slashes: a
# .properties file treats a backslash as an escape.
#   thermalbench.nativeLlama=true
#   thermalbench.llamaCppDir=C:/Users/you/src/llama.cpp
thermalbench.nativeLlama=false
thermalbench.llamaCppDir=
# The llama.cpp release the native backend is built and verified against. The
# build warns if the checkout differs; the version is stamped into every result.
thermalbench.llamaCppTag=b11879

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
